# ── Privacy ───────────────────────────────────────────────────────────────────
# Added 2026-10-09 because `topics.yaml`'s privacy topic was matching nothing: there was no source
# in this file covering privacy law at all, which is a source gap rather than a topic-wording
# problem. Every candidate below was probed with urllib before being written here, and the ones
# that failed are recorded at the bottom of this file rather than quietly omitted.
privacy | EDPB — European Data Protection Board | https://www.edpb.europa.eu/feed/news_en
# CNIL publishes in FRENCH. Kept deliberately: it is the most active national DPA feed that
# answers, the embedding model is multilingual so cross-lingual retrieval does work, and EDPB
# covers the EU-wide English-language side. Expect French text in any chunk it produces, and
# drop this line if that reads badly in a digest.
privacy | CNIL (French) | https://www.cnil.fr/fr/rss.xml

