# ── Probed 2026-10-09 and NOT added, so nobody re-researches them ─────────────
# Recorded because "we already checked" is worth more than a shorter file.
#   FTC            — its own /stay-connected/rss page lists /feeds/press-release.xml and
#                    /feeds/press-release-consumer-protection.xml, and both are unreachable from
#                    `spark`: 403 to this reader's user agent, 404 to a full browser header set.
#                    The feeds exist; this host cannot have them.
#   ICO (UK)       — no feed discoverable. Four candidate paths 404, and its media-centre page
#                    declares no <link rel="alternate"> feed at all.
#   EDPS, ENISA    — same: every candidate path 404s and neither page declares a feed.
#   IAPP           — no feed; /feed/ and /news/rss both 404.
#   NIST News (general) — works (40 entries) but deliberately skipped: it is all of NIST, from
#                    materials science to metrology, and would add volume without serving any
#                    topic in topics.yaml. NIST's two focused feeds above are in instead.
#   NCSC News / NCSC Reports — both work, and both are strict subsets of the NCSC UK "all" feed
#                    above. Taking all three would ingest the same advisory up to three times.
