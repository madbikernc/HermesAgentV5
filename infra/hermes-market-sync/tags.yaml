# S38c Market Watch thematic tags — one rule per line: `tag | match_type | pattern`.
#
# Boss-edited directly, like feeds.yaml/topics.yaml, for every tag except the two named below.
# hermes-market-sync.py's `tags` pass reads this file verbatim on every run and rebuilds the
# `tags` table from it in full. Blank lines and lines starting with # are ignored.
#
# Correction, S38h: `frontier_llm`/`ai_hardware` lines may ALSO be appended by
# hermes-market-gate.py, on an explicit human reply ("market tag approve <TICKER>") to an
# LLM-classified candidate hermes-market-sync.py's tag-scout proposed — never silently, and never
# without that reply. Every machine-appended line is preceded by its own
# `# added via FleetOps gate approval, <date>` comment line (never an inline trailing comment —
# load_tags()'s parser only recognizes a comment as a whole line, so an inline one would have
# silently broken the rule's own ticker match), so a human reading this file can tell
# machine-appended lines from hand-authored ones at a glance. Every other tag stays exactly
# "no NLP, no LLM judgment," as this paragraph originally said in full.
#
# Despite the .yaml extension, this is NOT real YAML — flat delimited text, same precedent as
# feeds.yaml/topics.yaml, so no PyYAML dependency anywhere in this repo. This file also carries
# no **Version:** header, the same (already-existing) gap feeds.yaml and topics.yaml both have
# despite CLAUDE.md's literal "every file" text — noted here rather than silently picked one way.
#
# match_type:
#   sector   exact, case-insensitive match against instruments.sector OR instruments.industry
#   ticker   exact ticker symbol (Wikipedia-canonical form — dots, not dashes: BRK.B not BRK-B)
#   keyword  case-insensitive substring match against name + sector + industry, concatenated
#
# A ticker can carry more than one tag; a tag can be seeded by more than one rule (deduplicated
# automatically). The six tags below are the ones MARKET_WATCH_DESIGN.md §4 names explicitly —
# "including but not limited to," i.e. add more lines/tags freely.

information_technology | sector  | Information Technology
ai                     | keyword | semiconductor
ai                     | keyword | artificial intelligence
ai                     | ticker  | NVDA
ai                     | ticker  | MSFT
ai                     | ticker  | GOOGL
ai                     | ticker  | META
agricultural           | keyword | agricultural
agricultural           | keyword | agriculture
fintech                | sector  | Financials
fintech                | keyword | payment
fintech                | keyword | fintech
industrials            | sector  | Industrials
energy_utilities       | sector  | Energy
energy_utilities       | sector  | Utilities

# frontier_llm / ai_hardware (S38g, direct operator request): a curated watchlist, not a broad
# sector/keyword net like `ai` above. Each gets its own dedicated per-ticker report section
# (hermes-market-report.py's "Frontier LLM Watch" / "AI Hardware Watch") in addition to showing
# up as one more line in the generic Thematic tag trends section. Exact-ticker rules only, kept
# deliberately explicit and short rather than matched by keyword — curation here IS the point.
# Membership checked against the real S&P 500 constituents table before being written down
# (2026-10-24): TSM and ARM are real AI-silicon names but are NOT S&P 500 members (confirmed
# absent from `instruments`), so they are deliberately left off rather than added as dead rules.
#
# frontier_llm: the in-house frontier-model developers that are actual S&P 500 constituents.
# OpenAI/Anthropic/xAI are not public and have no ticker to add.
frontier_llm | ticker | GOOGL
frontier_llm | ticker | GOOG
frontier_llm | ticker | META
frontier_llm | ticker | MSFT
frontier_llm | ticker | AMZN
#
# ai_hardware: companies whose core business IS AI-specific silicon/memory/networking, not
# general-purpose IT hardware or storage vendors that merely resell AI servers.
ai_hardware | ticker | NVDA
ai_hardware | ticker | AMD
ai_hardware | ticker | AVGO
ai_hardware | ticker | MU
ai_hardware | ticker | INTC
ai_hardware | ticker | MRVL
ai_hardware | ticker | ANET
