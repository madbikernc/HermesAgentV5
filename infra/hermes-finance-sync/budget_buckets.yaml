# Maps this module's own granular `category` values (categories.yaml's left column) onto Fidelity's
# "Budget Worksheet" taxonomy (FINANCE_TRACKER_DESIGN.md §6) — one rule per line:
# `category | bucket | field`.
#
# Same flat-delimited-text convention as categories.yaml/tags.yaml/feeds.yaml/topics.yaml. Despite the
# .yaml extension, this is NOT real YAML. Blank lines and lines starting with # are ignored.
# tools/hermes_finance_common.py's load_budget_buckets() reads this file verbatim.
#
# A granular category with NO line here is deliberately left unmapped — `classify_budget()` leaves its
# bucket/field NULL and it shows up in the review queue, rather than being guessed into a bucket the
# worksheet never actually offers for it. Deliberately absent, per direct operator decision: `Cash & ATM`
# (could be spent on anything), `Shopping` (general retail has no worksheet bucket), `Financial` (Venmo —
# no way to know what a P2P transfer was for), `Education` (no worksheet bucket), and
# `Utilities:Gas & Electric` (conflates electric + gas in one category, but the worksheet splits them into
# separate fields — review by hand, choosing `Housing`/`Electricity` or `Housing`/`Oil/Gas`).
#
# `Transfer` is handled in code, not here: it is excluded from classification entirely (same `category =
# 'Transfer'` reporting exclusion §6/§9 already give the granular categorizer), never shown as needing
# review.
#
# `Income` is not a bucket the worksheet itself breaks out (it has one top-line "take-home pay" figure,
# no itemized income section) — added here as a small, necessary extension so paycheck/interest
# transactions don't sit in the review queue forever.

