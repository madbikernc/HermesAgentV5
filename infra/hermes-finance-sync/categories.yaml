# S47 Firmament Finance Tracker categorization rules — one rule per line:
# `category | match_type | pattern`.
#
# Operator-edited directly, same convention as infra/hermes-market-sync/tags.yaml/feeds.yaml/
# topics.yaml. tools/hermes_finance_common.py's load_categories() reads this file verbatim;
# categorize_transaction() matches a transaction's merchant name/memo against these rules in
# order and returns the FIRST category whose pattern matches — unlike Market Watch's own tags
# (one ticker can carry many tags), a transaction gets exactly one category. Blank lines and
# lines starting with # are ignored.
#
# Despite the .yaml extension, this is NOT real YAML — flat delimited text, same precedent as
# tags.yaml/feeds.yaml/topics.yaml, so no PyYAML dependency anywhere in this repo.
#
# The only currently-valid match_type is `keyword` (case-insensitive substring match).
#
# This is a seed, not an exhaustive list — FINANCE_TRACKER_DESIGN.md §6 frames the taxonomy
# below as "including but not limited to." Extend it as real transaction data (once S47a/b land)
# shows gaps. `Transfer` is semantically load-bearing, not a cosmetic bucket: §6/§9 exclude
# `category = 'Transfer'` from income/expense totals, since a transfer between the operator's own
# accounts would otherwise double-count real spending already categorized once on the other side.
#
# Order matters: rules are checked top to bottom, first match wins. A more specific pattern that
# could be shadowed by a broader one listed later (or vice versa) should be reordered deliberately,
# not left to coincidence.

