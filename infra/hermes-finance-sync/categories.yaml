# S47 Firmament Finance Tracker categorization rules — one rule per line:
# `category | match_type | pattern`.
#
# Operator-edited directly, same convention as infra/hermes-market-sync/tags.yaml/feeds.yaml/
# topics.yaml. tools/hermes_finance_common.py's load_categories() reads this file verbatim;
# categorize_transaction() matches a transaction's merchant name/memo against these rules in
# order and returns the FIRST category whose pattern matches — unlike Market Watch's own tags
# (one ticker can carry many tags), a transaction gets exactly one category. Blank lines and
# lines starting with # are ignored.
#
# Despite the .yaml extension, this is NOT real YAML — flat delimited text, same precedent as
# tags.yaml/feeds.yaml/topics.yaml, so no PyYAML dependency anywhere in this repo.
#
# The only currently-valid match_type is `keyword` (case-insensitive substring match).
#
# Category taxonomy below is drawn from the operator's real Simplifi transaction history
# (2026-11-22, "Simplifi - Transactions.csv"), not guessed — these are the actual category
# strings Simplifi's own export uses, so a transaction this module categorizes lines up with
# how the operator already categorizes the same merchant by hand. Two things seen in that
# export are deliberately NOT represented here: Simplifi's own per-account labels (it fills
# `Category` with an account nickname rather than a real category for transfers between the
# operator's own accounts — personally identifying either way, and `Transfer` below is already
# the category of record for that per the paragraph after next), and `Uncategorized` (Simplifi's
# own "no category assigned" marker — this module's equivalent is already
# categorize_transaction() returning `None`, so it needs no rule of its own). A handful of real
# categories with only one supporting transaction, or whose only real-world keyword would be a
# person's name, a specific medical condition, or other identifying detail, were left out rather
# than represented with an unsafe or no pattern at all — this file only ever holds the operator's
# own merchant/category choices, never anyone else's identity or health/religious detail.
#
# `Transfer` is semantically load-bearing, not a cosmetic bucket: FINANCE_TRACKER_DESIGN.md §6/§9
# exclude `category = 'Transfer'` from income/expense totals, since a transfer between the
# operator's own accounts would otherwise double-count real spending already categorized once
# on the other side.
#
# Order matters: rules are checked top to bottom, first match wins. A more specific pattern that
# could be shadowed by a broader one listed later (or vice versa) is ordered deliberately, not
# left to coincidence — e.g. "amazon kindle" before the bare "amazon" below, and the "atm fee"
# rule ahead of Cash & ATM's own "atm" rule, so a transaction matching both resolves to the more
# specific category.

