# Firmament fleet Prometheus scrape config. See ../README.md for install steps and
# ../../../FIRMAMENT_OBSERVABILITY_PLAN.md for the full reasoning.
global:
  scrape_interval: 30s
  evaluation_interval: 30s
  external_labels:
    fleet: firmament

alerting:
  alertmanagers:
    - static_configs:
        - targets: ["127.0.0.1:9093"]

rule_files:
  - "rules/*.yml"

scrape_configs:
  - job_name: "prometheus"
    static_configs:
      - targets: ["127.0.0.1:9090"]

  - job_name: "node_exporter"
    static_configs:
      - targets: ["127.0.0.1:9100"]
        labels: { host: "homed13" }
      - targets: ["10.129.1.15:9100"]
        labels: { host: "dgx-spark" }
      - targets: ["10.129.1.17:9100"]
        labels: { host: "dgx-spark2" }

  # hermes-router.py 2.23.0's own, separate metrics-only listener (see that file's own
  # changelog) -- never the main router port (127.0.0.1-only, unchanged).
  - job_name: "hermes_router"
    static_configs:
      - targets: ["10.129.1.15:9101"]
        labels: { host: "dgx-spark" }
      - targets: ["10.129.1.17:9101"]
        labels: { host: "dgx-spark2" }

  # Minecraft bot-sandbox server (192.168.1.221), TickScope plugin -- a different administrative
  # domain from the three Hermes fleet hosts. Earlier draft of this comment claimed the box had
  # "no firewall capability at all"; that was wrong, found live 2026-11-28 while debugging this
  # exact scrape target: it runs ufw, default-deny-incoming, and simply had no rule for 9101
  # (a silent drop, not a refusal -- the actual cause of the "unreachable" symptom, not pfSense).
  # Fixed with a scoped `ufw allow` for 192.168.1.215 (the fleet-LAN source gets NAT-hairpinned to
  # that address on this path -- see FIRMAMENT_OBSERVABILITY_PLAN.md 1.3.0 / Phase 4). TickScope's
  # own bearer-token auth stays the control that actually matters for anything already inside
  # 192.168.1.0/24, which ufw does not scope by design. The token lives in
  # /opt/prometheus-secrets/tickscope-token on HomeD13 (NOT in this repo -- see README.md's own
  # note on why), referenced here rather than inlined.
  # TickScope's own metrics already carry a server="paper" label (its config.yml's own
  # server-id) -- deliberately NOT adding a same-named Prometheus-side label here, which would
  # either collide or require relying on honor_labels semantics for no real benefit. Dashboards
  # query server="paper" directly.
  - job_name: "minecraft_tickscope"
    authorization:
      credentials_file: /opt/prometheus-secrets/tickscope-token
    static_configs:
      - targets: ["192.168.1.221:9101"]

  # Each Minecraft bot's own action counters (services/minecraft-bots/metrics.js, direct request
  # 2026-11-28) -- mobs killed/blocks placed/blocks mined/items crafted/distance traveled, by bot.
  # A different metric namespace (mc_bot_*) from TickScope's own mc_* above on purpose: TickScope
  # observes the server; this is each bot reporting its own actions. One port per bot (roster and
  # ufw rule in infra/minecraft-bots/README.md §7) -- only the two personas actually running
  # (services/minecraft-bots/README.md's own status line) are listed here; the other seven's ports
  # are reserved and firewalled but not scraped, so a deliberately-stopped bot doesn't show up as
  # a permanently-down target. Add its target here when it's relaunched.
  # No `bot` label added here -- metrics.js's own samples already carry one (same reasoning as the
  # TickScope job above skipping a Prometheus-side `server` label): a same-named static_configs
  # label would collide and get silently renamed to exported_bot instead of actually overriding it
  # (confirmed live 2026-11-28 -- caught by checking the scraped series, not assumed).
  - job_name: "minecraft_bots"
    static_configs:
      - targets: ["10.129.1.15:9110"]
        labels: { host: "dgx-spark" }
      - targets: ["10.129.1.15:9111"]
        labels: { host: "dgx-spark" }
