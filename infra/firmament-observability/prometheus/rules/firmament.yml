# Starting alert rules — intentionally small. Add more only when a specific incident shows a gap,
# matching this project's own "don't add a metric/check speculatively" rule (see tests/README.md's
# baseline-metric guidance, applied here to alerting too).
groups:
  - name: firmament-host
    rules:
      - alert: FirmamentHostDown
        expr: up{job="node_exporter"} == 0
        for: 5m
        labels: { severity: critical }
        annotations:
          summary: "{{ $labels.host }} is not reporting host metrics"
          description: "node_exporter on {{ $labels.host }} has been unreachable for 5+ minutes."

      - alert: FirmamentHostDiskLow
        expr: (node_filesystem_avail_bytes{mountpoint="/"} / node_filesystem_size_bytes{mountpoint="/"}) < 0.10
        for: 15m
        labels: { severity: warning }
        annotations:
          summary: "{{ $labels.host }}'s root filesystem is below 10% free"
          description: "Checked live 2026-11-28: spark was at 62% used, spark2 74%, homed13 11% — this fires well before any of them would have been near the edge then."

      # /mnt/hermes-data (spark/spark2) holds the fleet's actual working data (memory/vectors/RAG
      # store) -- a different, bigger-consequence volume than root, confirmed 57-71% used live
      # 2026-11-28 (FIRMAMENT_OBSERVABILITY_PLAN.md §2). Same 10% threshold as root; this volume
      # fills from normal fleet operation, not logs, so it deserves its own page rather than
      # sharing root's alert and being invisible until root itself is also low.
      - alert: FirmamentDataVolumeLow
        expr: (node_filesystem_avail_bytes{mountpoint=~"/mnt/hermes-data|/mnt/nas2-hermes-images|/mnt/nas2-hermes-backup"} / node_filesystem_size_bytes{mountpoint=~"/mnt/hermes-data|/mnt/nas2-hermes-images|/mnt/nas2-hermes-backup"}) < 0.10
        for: 15m
        labels: { severity: warning }
        annotations:
          summary: "{{ $labels.host }}'s {{ $labels.mountpoint }} is below 10% free"
          description: "This volume holds live fleet data (memory/vectors/RAG store, or the NAS image archive), not just logs -- filling it stops real work, not just housekeeping."

      # Found the hard way this session: minecraft_tickscope sat unreachable for hours with
      # nothing paging anyone, because FirmamentHostDown above only ever checked job="node_exporter".
      # Any scrape target going dark deserves the same page, not just the three node_exporter ones.
      - alert: FirmamentTargetDown
        expr: up{job=~"hermes_router|minecraft_tickscope|minecraft_bots"} == 0
        for: 5m
        labels: { severity: critical }
        annotations:
          summary: "Prometheus target {{ $labels.job }} ({{ $labels.host }}{{ $labels.instance }}) is down"
          description: "Unreachable for 5+ minutes. For minecraft_tickscope specifically, check the pfSense rule and the box's own ufw first -- both have silently dropped this exact scrape before (2026-11-28). minecraft_bots only lists bots that are supposed to be running (infra/minecraft-bots/README.md §7) -- a stopped persona was never added as a target, so this firing means a bot that should be up isn't."

  - name: firmament-minecraft
    rules:
      # TickScope's own collection can fail (or silently stop) without the HTTP endpoint itself
      # going down -- FirmamentTargetDown above would stay green while every Minecraft panel on
      # the dashboard quietly goes stale. This catches that case specifically.
      - alert: FirmamentMinecraftCollectionStale
        expr: (time() - mc_collection_last_success_timestamp_seconds{server="paper"}) > 300
        for: 5m
        labels: { severity: warning }
        annotations:
          summary: "TickScope's own metrics collection hasn't succeeded in 5+ minutes"
          description: "The /metrics endpoint may still answer (see FirmamentTargetDown), but TickScope itself isn't producing fresh data -- every Minecraft Grafana panel is showing stale numbers."

  - name: firmament-router
    rules:
      - alert: FirmamentRouterErrorRateHigh
        expr: |
          sum by (host, role) (rate(hermes_router_requests_total{status="error"}[10m]))
          /
          sum by (host, role) (rate(hermes_router_requests_total[10m]))
          > 0.25
        for: 10m
        labels: { severity: warning }
        annotations:
          summary: "hermes-router role {{ $labels.role }} on {{ $labels.host }} has a >25% error rate"
          description: "Over the last 10 minutes. Check that role's backend (llama-server process) and hermes-router's own log."
